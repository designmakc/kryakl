# Windows installer: npm run dist → release/Kryakl-Setup-<version>.exe
# The id of 2Talker, the app's first name: Kryakl installs over it and over Altype, and updates them.
# An update keeps the folder the app was installed in (NSIS reads InstallLocation
# from the registry key of this id), so Programs\altype stays Altype's old home and
# the Chrome extension loaded unpacked from it keeps working; a new install goes to
# Programs\kryakl (package.json's name). The program is Kryakl.exe either way.
appId: com.ikstro.2talker
productName: Kryakl
copyright: Copyright © 2026 Yevhen Peshynskyi
directories:
  output: release
  buildResources: build
files:
  - package.json
  - LICENSE
  - NOTICE
  - dist/**
  - "!dist/**/*.map"
  - media/**
  - vendor/**
  # The speech engine's source (a few hundred KB): Python runs it from disk, from
  # an environment installed outside the app (src/speechpack.ts). The extension
  # is a folder Chrome loads unpacked.
  - engine/*.py
  - engine/models.json
  - engine/calibration/**
  - engine/pyproject.toml
  - engine/uv.lock
  - extension/**
# The translator and the voice run as a thread and a process of their own and
# read the engine from disk: they live outside the archive. So does the
# keyboard thread, with koffi, which it loads from beside it.
asarUnpack:
  - dist/mt-worker.js
  - dist/voice-worker.js
  - dist/kbd-worker.js
  - dist/field-worker.js
  - node_modules/koffi/**
  - vendor/**
  # Windows plays a sound from a file of its own, never from inside the archive.
  - media/fix.wav
  - media/switch/**
  - engine/**
  - extension/**
# koffi ships prebuilt for Node-API; nothing to rebuild for Electron.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  artifactName: Kryakl-Setup-${version}.${ext}
  # Uninstall asks whether the data goes too (build/installer.nsh); an update keeps it.
  include: build/installer.nsh
# No publish settings: the release workflow puts the installer in a GitHub release itself, and Kryakl does
# not update itself (people download new versions from the releases). The installer is not signed
# (a free app): Windows warns at install.
# Mac (npm run dist:mac → release/Kryakl-<version>-arm64.dmg): not signed, so the first
# start is right-click › Open. The Windows keyboard, clipboard and OCR parts are off there.
mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.education
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: Kryakl copies the selected text to translate it.
    NSMicrophoneUsageDescription: Kryakl listens when you dictate.
dmg:
  artifactName: Kryakl-${version}-${arch}.${ext}
